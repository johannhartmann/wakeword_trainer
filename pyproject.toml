[project]
name = "wakeword-trainer"
version = "0.1.0"
description = "Train custom wake word models for openWakeWord using LLM-generated phrases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Johann Hartmann" }
]
keywords = ["wake-word", "voice-assistant", "speech-recognition", "openwakeword", "tts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "acoustics>=0.2.6",
    "audiomentations>=0.43.1",
    "datasets>=5.2.0",
    "google-genai>=2.33.0",
    "huggingface-hub>=2.4.0",
    "librosa>=0.11.0",
    "mutagen>=1.48.1",
    "numba>=0.68.1",
    "numpy>=2.2.6",
    "onnx>=1.23.2",
    "openwakeword>=0.6.0",
    "pandas>=2.3.3",
    "piper-tts>=1.8.0",
    "pronouncing>=0.3.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    # acoustics imports scipy.special.sph_harm, removed in SciPy 1.17.
    "scipy>=1.15.3,<1.17.0",
    "speechbrain>=1.1.2",
    "torch>=2.14.1",
    "torch-audiomentations>=0.12.0",
    "torchaudio>=2.11.1",
    "protobuf>=7.36.2",
    "wheel>=0.48.0",
    "soundfile>=0.14.0",
    "tqdm>=4.70.1",
    "deep-phonemizer>=0.0.19",
    "onnxruntime-gpu>=1.23.2",
]

[project.urls]
Homepage = "https://github.com/johannhartmann/wakeword_trainer"
Repository = "https://github.com/johannhartmann/wakeword_trainer"
Issues = "https://github.com/johannhartmann/wakeword_trainer/issues"

[project.scripts]
wakeword-trainer = "wakeword_trainer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wakeword_trainer"]

[tool.uv]
# Use ONNX instead of TFLite and install only one ONNX Runtime implementation.
# onnxruntime-gpu supplies the same Python module as onnxruntime.
override-dependencies = [
    "tflite-runtime ; python_version < '0'",
    "onnxruntime ; python_version < '0'",
]
