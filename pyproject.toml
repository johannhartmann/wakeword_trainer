[project]
name = "wakeword-trainer"
version = "0.1.0"
description = "Train custom wake word models for openWakeWord using LLM-generated phrases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Johann Hartmann" }
]
keywords = ["wake-word", "voice-assistant", "speech-recognition", "openwakeword", "tts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "acoustics>=0.2.6",
    "audiomentations>=0.30.0",
    "datasets>=2.0.0",
    "google-genai>=1.0.0",
    "huggingface-hub>=0.20.0",
    "librosa>=0.10.0",
    "mutagen>=1.45.0",
    "numba>=0.60.0",
    "numpy>=1.24.0",
    "onnx>=1.14.0",
    "openwakeword>=0.6.0",
    "pandas>=2.0.0",
    "piper-tts>=1.2.0",
    "pronouncing>=0.2.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.10.0,<1.17.0",
    "speechbrain>=1.0.0",
    "torch>=2.6.0",
    "torch-audiomentations>=0.11.0",
    "torchaudio>=2.6.0",
    "protobuf>=5.29.0",
    "wheel>=0.46.0",
    "soundfile>=0.12.0",
    "tqdm>=4.65.0",
    "deep-phonemizer>=0.0.19",
    "onnxruntime-gpu>=1.23.2",
]

[project.urls]
Homepage = "https://github.com/johannhartmann/wakeword-trainer"
Repository = "https://github.com/johannhartmann/wakeword-trainer"
Issues = "https://github.com/johannhartmann/wakeword-trainer/issues"

[project.scripts]
wakeword-trainer = "wakeword_trainer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wakeword_trainer"]

[tool.uv]
# openwakeword requires tflite-runtime on Linux which doesn't support Python 3.13
override-dependencies = ["tflite-runtime ; python_version < '0'"]
